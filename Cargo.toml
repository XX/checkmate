[package]
name = "checkmate"
version = "0.1.0"
edition = "2024"

[profile.dev]
opt-level = 1

    [profile.dev.package."*"]
    opt-level = 3


[dependencies]
bevy = { version = "0.19", features = ["bevy_remote", "serialize", "jpeg", "tga"] }
bevy-inspector-egui = "0.37"
bevy_obj = "0.19"
bevy_perf_ui = "0.7" # https://github.com/IyesGames/iyes_perf_ui
big_space = { git = "https://github.com/aevyrie/big_space", rev = "5f255228e9b4ff30756347b80f92b19ebf7b5c56", features = [
    "i32",
] }
clap = { version = "4.6", features = ["derive"] }
config-load = "0.1"
derive_more = { version = "2.1", features = ["debug"] }
fastrand = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
