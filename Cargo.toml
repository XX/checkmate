[package]
name = "checkmate"
version = "0.1.0"
edition = "2024"

[profile.dev]
opt-level = 1

    [profile.dev.package."*"]
    opt-level = 3


[dependencies]
bevy = { version = "0.19", features = ["serialize", "jpeg", "tga"] }
bevy-inspector-egui = "0.37"
bevy_obj = "0.19"
bevy_perf_ui = "0.7" # https://github.com/IyesGames/iyes_perf_ui
clap = { version = "4.6", features = ["derive"] }
config-load = "0.1"
derive_more = { version = "2.1", features = ["debug"] }
fastrand = "2.5"
serde = { version = "1.0", features = ["derive"] }
